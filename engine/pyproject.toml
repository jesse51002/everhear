[project]
name = "vfg-engine"
version = "0.1.0"
description = "The EverHear game engine: one process beside Minecraft that runs abilities, items, marks, actors and scenarios as live Python classes (the game engine spec)."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
